[package]
name = "serverbox"
version = "1.0.4"
description = "Serverbox is an open-source, agentless desktop control panel for Linux servers. It connects over SSH, so there is nothing to install on the servers you manage."
authors = ["Serverbox"]
license = "MIT"
edition = "2021"
rust-version = "1.88.0"

[lib]
name = "serverbox_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
base64 = "0.22"
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
ssh2 = { version = "0.9", features = ["vendored-openssl"] }
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
zeroize = "1"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["clock", "serde"] }
walkdir = "2"
cron = "0.15"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
